<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    {{ dirref "styles" }}
    {{ dirref "scripts" }}
  </head>
  <body>
    <div class="container fade-in">
      <div class="glass-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2 style="margin: 0;">Link Management</h2>
          <a href="/" style="color: var(--accent); text-decoration: none; font-weight: bold;">&larr; Back Home</a>
        </div>
        <p class="subtitle" style="text-align: left;">View all shortened URLs in the database (requires root password).</p>
        
        <div class="filter-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
          <input type="text" id="filterStartsWith" placeholder="Link starts with (e.g. https://github.com)" style="width: 100%; box-sizing: border-box;" />
          <input type="number" id="filterMinRedirects" placeholder="Minimum Redirects" style="width: 100%; box-sizing: border-box;" min="0" />
          <input type="date" id="filterMinCreation" style="width: 100%; box-sizing: border-box;" title="Created After" />
          <input type="password" id="passInput" placeholder="Enter root password" style="width: 100%; box-sizing: border-box;" />
        </div>
        
        <div class="input-group">
          <button id="listBtn" style="width: 100%;">List Links</button>
        </div>
        
        <div id="linksTableContainer" style="margin-top: 20px;"></div>
      </div>
    </div>
  </body>
</html>
