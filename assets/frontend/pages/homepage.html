<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ .Title }}</title>
    {{ dirref "styles" }}
    {{ dirref "scripts" }}
  </head>
  <body>
    <div class="container fade-in">
      <div class="glass-panel">
        <h1>Url Shortner</h1>
        <p class="subtitle">Shorten your long links into easily shareable URLs instantly.</p>
        
        <div class="input-group">
          <input type="text" id="urlInput" placeholder="Enter your long URL here (e.g. https://google.com)" />
          <button id="shortenBtn">Shorten</button>
        </div>
        <div id="result" class="result"></div>
      </div>

      <div class="glass-panel" style="animation-delay: 0.2s;">
        <h2>Link Management</h2>
        <p class="subtitle" style="text-align: left;">View all shortened URLs in the database (requires root password).</p>
        
        <div class="input-group">
          <input type="password" id="passInput" placeholder="Enter root password" />
          <button id="listBtn">List Links</button>
        </div>
        <div id="linksTableContainer"></div>
      </div>
    </div>
  </body>
</html>
