args:
    - end: 0
      id: Command
      start: 0
      trigger:
        type: equal
        value: start-server
category: Server
examples:
    - start-server
    - start-server --addr 4000:5000
flags:
    - default: 3000:4000
      description: the port the server listens on, or a range of ports it takes the first free one of, with or without a host (8080, 4000:5000, 127.0.0.1:4000:5000, :8080)
      id: Addr
    - default: "10000"
      description: how long a request has to arrive, in milliseconds
      id: ReadTimeoutMs
      type: integer
    - default: "10000"
      description: how long a response has to be written, in milliseconds
      id: WriteTimeoutMs
      type: integer
    - default: "10000"
      description: how long the requests in flight have to finish once the server is asked to stop, in milliseconds (0 waits for them)
      id: ShutdownTimeoutMs
      type: integer
    - description: the secret used to hash passwords for backoffice authentication
      id: Secret
      required: true
help: Starts the http server
long-description: |
    Opens the port and serves every route declared under
    sandbox/internal/routeslist, until the process is stopped. An interrupt
    (Ctrl+C) or a termination request stops it gracefully: no new request is
    taken, and the ones in flight get --shutdown-timeout-ms to finish.
priority: 100
