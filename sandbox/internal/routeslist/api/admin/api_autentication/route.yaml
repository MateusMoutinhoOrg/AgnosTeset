category: Middleware
help: Requires a valid API token on every /api/admin route
long-description: 'Every /api/admin route needs an API token, sent as Authorization: Bearer <token>. Tokens are created and revoked on the backoffice page /admin/list-backoffice-api-tokens; the api never issues one. A token may expire on a date or never, and may be limited to a list of client ips. A missing, unknown, revoked or expired token, or one used from an ip it does not allow, is answered 401 in JSON.'
methods:
    - ANY
parameters:
    - description: an API token created on /admin/list-backoffice-api-tokens, as Bearer <token>
      fonts:
        - header
      id: Authorization
      key: authorization
      type: string
    - description: the ip the request came from, set by the server and never by the client
      fonts:
        - header
      id: XClientIp
      key: x-client-ip
      type: string
paths:
    - end: -1
      id: Route
      start: 0
      trigger:
        type: prefix
        value: /api/admin
priority: 10
response-type: application/json
