body:
    content-type: application/x-www-form-urlencoded
    form-schema:
        properties:
            password:
                type: string
            username:
                type: string
        required:
            - password
            - username
        type: object
    max-bytes: 1048576
    required: true
    type: form
category: Backoffice
help: Signs a backoffice user in and sets the session cookie
methods:
    - POST
parameters:
    - description: the ip the request came from, set by the server and never by the client
      fonts:
        - header
      id: XClientIp
      key: x-client-ip
      type: string
paths:
    - end: 1
      id: AdminLogin
      start: 0
      trigger:
        type: equal
        value: /admin/login
priority: 100
response-type: text/html
segments: 2
