category: Backoffice Backups API
examples:
    - 'curl localhost:3000/api/admin/root/list-backup-snapshot-files/1 -H "Authorization: Bearer $TOKEN"'
    - 'curl "localhost:3000/api/admin/root/list-backup-snapshot-files/1?prefix=backofficedb/" -H "Authorization: Bearer $TOKEN"'
methods:
    - GET
parameters:
    - description: keeps only the files whose path below data/ starts with it
      id: Prefix
      key: prefix
      sources:
        - query
      type: string
paths:
    - end: 3
      id: ApiAdminRootListBackupSnapshotFiles
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/list-backup-snapshot-files
    - end: 4
      id: Id
      start: 4
      type: integer
priority: 100
response-type: application/json
segments: 5
summary: Lists every file of a snapshot, or the ones whose path starts with a prefix, as its path below data/ and the sha of its content
