body:
    content-type: application/json
    json-schema:
        properties:
            name:
                maxLength: 100
                type: string
        type: object
    max-bytes: 1048576
    type: json
category: Backoffice Backups API
examples:
    - 'curl -X POST localhost:3000/api/admin/root/create-backup-snapshot -H "Authorization: Bearer $TOKEN"'
    - 'curl -X POST localhost:3000/api/admin/root/create-backup-snapshot -H "Authorization: Bearer $TOKEN" -H ''Content-Type: application/json'' -d ''{"name":"before-migration"}'''
methods:
    - POST
paths:
    - end: 3
      id: ApiAdminRootCreateBackupSnapshot
      start: 0
      trigger:
        type: equal
        value: /api/admin/root/create-backup-snapshot
priority: 100
response-type: application/json
segments: 4
summary: 'Starts a snapshot of every database, under the name given or one after the current instant, and answers 202 at once: it is taken in the background'
